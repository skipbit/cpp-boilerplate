# Guards the claim that this builds and passes its tests on the compilers people
# are likely to have. Four combinations rather than every possible one: add to
# the matrix when you start caring about a platform this does not cover.
name: build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} · ${{ matrix.cxx }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Listed one by one rather than as os × compiler: with `include`, the
      # entries overwrite the compiler for every os instead of multiplying,
      # and the matrix silently shrinks to the last one.
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++ }
          - { os: ubuntu-26.04, cc: gcc, cxx: g++ }
          - { os: ubuntu-26.04, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCPPBP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      # Runs the unit tests and, separately, installs the package and builds a
      # project against it. The second one is what catches a broken install
      # rule, which a passing unit test says nothing about.
      - name: Test
        run: ctest --test-dir build --output-on-failure
