# Reusable: everything that has to hold before a change is allowed in.
#
# Three kinds of job, because there are three different questions:
#
#   native          - does this build with what people actually have? Ubuntu's
#                     own compilers and CMake, no extra repositories.
#   pinned          - does this build in a fixed environment? Versions are
#                     frozen in .devcontainer/Dockerfile, which the dev
#                     container also uses, so a failure here is a real change
#                     and never a surprise upgrade.
#   static-analysis - does it pass clang-tidy and clang-format? In the pinned
#                     image, so that everyone is arguing with the same version.
name: build and test

on:
  workflow_call:

permissions:
  contents: read

# `shell: bash` is not the shell a run step gets by default. The default is
# `bash -e`; naming it explicitly gets `bash -eo pipefail`, so a command that
# fails on the left of a pipe fails the step instead of being overwritten by
# whatever came after it. Set once for the workflow rather than per step,
# because the flags belong to the shell, not to whichever commands happen to be
# in it today - a step added next month gets them without anybody remembering.
defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.os }} · ${{ matrix.cxx }} · ${{ matrix.stdlib }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Listed one by one rather than as os × compiler: with `include`, the
      # entries overwrite the compiler for every os instead of multiplying,
      # and the matrix silently shrinks to the last one.
      #
      # The standard library is a column because it decides more than the
      # compiler does. clang against libstdc++ and clang against libc++ are two
      # different sets of C++23, missing different things - and clang picks
      # libstdc++ by default here, so a project that only builds the default has
      # not checked the configuration its own escape hatch uses.
      #
      # Six combinations rather than every possible one: add to the matrix when
      # you start caring about a platform this does not cover, and delete the
      # rows for platforms you have decided not to support.
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, stdlib: libstdc++ }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, stdlib: libstdc++ }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, stdlib: libc++ }
          - { os: ubuntu-26.04, cc: gcc, cxx: g++, stdlib: libstdc++ }
          - { os: ubuntu-26.04, cc: clang, cxx: clang++, stdlib: libstdc++ }
          - { os: ubuntu-26.04, cc: clang, cxx: clang++, stdlib: libc++ }
    steps:
      - uses: actions/checkout@v7

      # Asked of the project rather than written here, for the reason the SBOM
      # option below is: this file is the same in every project that starts from
      # a template, and what a particular one needs is in its CMakeLists.txt.
      #
      # Two questions. Does it use Qt, which has to be installed and is large
      # enough that a project with no interface should not wait for it. And does
      # it refuse libc++ - a project that links a Qt built against libstdc++
      # cannot be built against libc++ at all, so two rows of this matrix are
      # not a failure it can fix. It says so at configure time; this reads the
      # same declaration and does not ask.
      - name: Ask the project what it can be built with
        id: project
        run: |
          qt=false
          libcxx=true
          if grep -q 'find_package(Qt6' CMakeLists.txt; then qt=true; fi
          if grep -q 'CPPBP_STANDARD_LIBRARY STREQUAL "libc++"' CMakeLists.txt; then libcxx=false; fi
          echo "qt=${qt}" >> "$GITHUB_OUTPUT"
          echo "libcxx=${libcxx}" >> "$GITHUB_OUTPUT"
          echo "needs Qt: ${qt}; can use libc++: ${libcxx}"

      - name: Say so when this row is one the project has refused
        if: matrix.stdlib == 'libc++' && steps.project.outputs.libcxx == 'false'
        run: |
          echo "::notice::This project cannot be built against libc++ and says so in"\
               "CMakeLists.txt. Nothing is built on this row."

      - name: Install ninja, and libc++ or Qt where they are wanted
        if: matrix.stdlib != 'libc++' || steps.project.outputs.libcxx == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then
            sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev
          fi
          # The qml6-module-* packages are the QML modules an interface imports
          # at run time. On 24.04 nothing pulls them in, and a program that
          # builds and links then fails to start.
          if [ "${{ steps.project.outputs.qt }}" = "true" ]; then
            sudo apt-get install -y --no-install-recommends \
              qt6-base-dev \
              qt6-declarative-dev \
              qml6-module-qtqml \
              qml6-module-qtqml-models \
              qml6-module-qtqml-workerscript \
              qml6-module-qtquick \
              qml6-module-qtquick-controls \
              qml6-module-qtquick-layouts \
              qml6-module-qtquick-templates \
              qml6-module-qtquick-window
          fi

      - name: Record what this job is actually building with
        if: matrix.stdlib != 'libc++' || steps.project.outputs.libcxx == 'true'
        run: |
          cmake --version | head -1
          ${{ matrix.cxx }} --version | head -1

      - name: Configure
        if: matrix.stdlib != 'libc++' || steps.project.outputs.libcxx == 'true'
        run: |
          flags=""
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then flags="-stdlib=libc++"; fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS="$flags" \
            -DCPPBP_WARNINGS_AS_ERRORS=ON

      - name: Build
        if: matrix.stdlib != 'libc++' || steps.project.outputs.libcxx == 'true'
        run: cmake --build build

      # Runs the unit tests and, separately, installs the package and builds a
      # project against it. The second one is what catches a broken install
      # rule, which a passing unit test says nothing about.
      #
      # An interface draws, and a runner has no display. A test that needs this
      # sets it itself so that running it by hand behaves the same way; it is
      # here as well because a test added later might not.
      - name: Test
        if: matrix.stdlib != 'libc++' || steps.project.outputs.libcxx == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  pinned:
    name: pinned toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the pinned image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The SBOM is off by default and needs a CMake newer than any Ubuntu LTS
      # ships, so this is the only place it is exercised. It is switched on here
      # deliberately: the key that unlocks the experimental feature changes
      # between CMake releases, and a changed key should be a failing job rather
      # than a document that silently stopped being written.
      #
      # Which option switches it on is read out of CMakeLists.txt rather than
      # written here. The option is named after the project, this file is the
      # same in every project that starts from a template, and renaming one
      # renames the option - so a name written here is wrong for everybody
      # except the first. A project with no such option, because install(SBOM)
      # cannot describe what it installs, is still built, tested and installed;
      # there is simply nothing to look for afterwards.
      - name: Build, test, and write an SBOM
        run: |
          sbom=$(grep -oE '[A-Za-z0-9_]+_GENERATE_SBOM' CMakeLists.txt | head -1 || true)
          echo "SBOM option: ${sbom:-none declared in CMakeLists.txt}"
          docker run --rm -v "$PWD":/src:ro -e SBOM="$sbom" toolchain:ci bash -euxo pipefail -c '
            cmake --version | head -1
            cmake -S /src -B /tmp/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCPPBP_WARNINGS_AS_ERRORS=ON \
              ${SBOM:+"-D${SBOM}=ON"}
            cmake --build /tmp/build
            ctest --test-dir /tmp/build --output-on-failure
            cmake --install /tmp/build --prefix /tmp/prefix
            if [ -n "$SBOM" ]; then
              find /tmp/prefix -name "*.spdx.json" -size +0c | grep -q .
            fi
          '

  static-analysis:
    name: clang-tidy and clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the pinned image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # clang-tidy runs in the compile step, so a violation fails the build.
      # Clang, not GCC: clang-tidy reads this build's flags, and GCC's own
      # warning names would fail every file as unknown warning options.
      # Fetched dependencies are not analysed - the module attaches clang-tidy
      # per target - so the tests are built and checked here like everything
      # else.
      # An exclusion in .clang-tidy with no reason written down is how a lint
      # configuration becomes untouchable. This makes that a build failure.
      - name: Check that every disabled check is explained
        run: ./scripts/check-tidy-rationale.sh

      - name: Run clang-tidy as part of the build
        run: |
          docker run --rm -v "$PWD":/src:ro toolchain:ci bash -euxo pipefail -c '
            cmake -S /src -B /tmp/tidy -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCPPBP_ENABLE_CLANG_TIDY=ON
            cmake --build /tmp/tidy
          '

      # Which files each of these three runs on comes from
      # scripts/lint-paths.sh, which .githooks/pre-commit asks the same question
      # of. One list, so the hook cannot check an extension this job does not -
      # which it did, over .h and .cc, and a file could pass a commit that no
      # job would ever have disagreed with.
      #
      # The list is worked out here rather than inside the container: it is read
      # from the git index, and git inside a container refuses a bind mount it
      # does not own as an unsafe repository.
      #
      # Matching nothing is a failure, not a pass. A check that silently has no
      # work is indistinguishable from one that found none.
      - name: Check formatting
        run: |
          mapfile -t files < <(./scripts/lint-paths.sh clang-format)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no files matched"; exit 1; }
          echo "clang-format: ${#files[@]} file(s)"
          docker run --rm -v "$PWD":/src:ro toolchain:ci \
            bash -euo pipefail -c 'cd /src && exec clang-format --dry-run --Werror "$@"' -- "${files[@]}"

      # No `command -v` here. The hook skips a checker it cannot find, because a
      # hook that blocks a commit over a missing tool is a hook people delete;
      # a job that skips one is a job that reports nothing and looks the same as
      # one that passed. Both are in the pinned image, and if they stop being
      # there this has to fail.
      - name: Check the shell scripts
        run: |
          mapfile -t files < <(./scripts/lint-paths.sh shellcheck)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no files matched"; exit 1; }
          echo "shellcheck: ${#files[@]} file(s)"
          docker run --rm -v "$PWD":/src:ro toolchain:ci \
            bash -euo pipefail -c 'cd /src && exec shellcheck "$@"' -- "${files[@]}"

      # actionlint reads .github/actionlint.yml from the working directory, so
      # this has to run with the repository as its cwd rather than by path.
      - name: Check the workflows
        run: |
          mapfile -t files < <(./scripts/lint-paths.sh actionlint)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no files matched"; exit 1; }
          echo "actionlint: ${#files[@]} file(s)"
          docker run --rm -v "$PWD":/src:ro toolchain:ci \
            bash -euo pipefail -c 'cd /src && exec actionlint "$@"' -- "${files[@]}"
