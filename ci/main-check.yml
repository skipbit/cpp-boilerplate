# Guards the claim that main is always in a state someone can start from.
#
# The same checks as pr-check, on purpose: a pull request can be merged while
# another one lands underneath it, and neither pull request built the result.
name: main check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build-and-test.yml
