# Publishes the pinned toolchain so a dev container can pull it instead of
# building it. CI does not depend on this image existing: every workflow builds
# the Dockerfile itself, so a failed publish never blocks a change.
#
# The weekly run exists because the base image receives security updates that
# the pinned versions above it do not pin away.
name: toolchain image

on:
  push:
    branches: [main]
    paths: [".devcontainer/Dockerfile", ".github/workflows/toolchain-image.yml"]
  schedule:
    - cron: "0 19 * * 1" # Monday 04:00 JST
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: true
          tags: ghcr.io/${{ github.repository }}/toolchain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
