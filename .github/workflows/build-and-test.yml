# Reusable: everything that has to hold before a change is allowed in.
#
# Each of the first three jobs is a different question:
#
#   native  - does this build with what people actually have? Ubuntu's own
#             compilers and CMake, no extra repositories. If this is green,
#             "git clone && cmake" works on a stock machine.
#   pinned  - does this build in a fixed environment? Versions are frozen in
#             .devcontainer/Dockerfile, which the dev container also uses, so a
#             failure here is a real change and never a surprise upgrade.
#   shared  - does the library still work when it is a .so? The other two build
#             it static, which is the default, and a static build never reaches
#             the export header, the hidden visibility or the SOVERSION.
#
# Then the qt template, in the image it ships rather than the shared one, and
# the linters.
name: build and test

on:
  workflow_call:

permissions:
  contents: read

# `shell: bash` is not the shell a run step gets by default. The default is
# `bash -e`; naming it explicitly gets `bash -eo pipefail`, so a command that
# fails on the left of a pipe fails the step instead of being overwritten by
# whatever came after it. Set once for the workflow rather than per step,
# because the flags belong to the shell, not to whichever commands happen to be
# in it today - a step added next month gets them without anybody remembering.
defaults:
  run:
    shell: bash

jobs:
  native:
    name: ${{ matrix.os }} · ${{ matrix.cxx }} · ${{ matrix.stdlib }} · ${{ matrix.qt == 'ON' && 'every template' || 'every template but qt' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The qt column is the row's reach, and the name above says it out
        # loud. Qt from a distribution is built against libstdc++ and exports
        # functions whose mangled names contain its standard library types, so
        # the two libc++ rows build the other three templates and not the
        # fourth - templates/qt/README.md has the measurements. Named
        # "ubuntu-24.04 · clang++ · libc++" and nothing more, such a row reads
        # as this repository building on libc++, which is a claim about four
        # templates that only three of them have been put to.
        #
        # One column rather than two: what the row builds is one fact, and the
        # name and the Configure step below both read it from here.
        include:
          # ubuntu-26.04 runners are in preview at the time of writing.
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, stdlib: libstdc++, qt: ON }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, stdlib: libstdc++, qt: ON }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, stdlib: libc++, qt: OFF }
          - { os: ubuntu-26.04, cc: gcc, cxx: g++, stdlib: libstdc++, qt: ON }
          - { os: ubuntu-26.04, cc: clang, cxx: clang++, stdlib: libstdc++, qt: ON }
          - { os: ubuntu-26.04, cc: clang, cxx: clang++, stdlib: libc++, qt: OFF }
    steps:
      - uses: actions/checkout@v7

      # Two questions, not one: which standard library this row uses, and
      # whether it builds the qt template. They answer the same way today and
      # are still asked separately, because a row that used libc++ and built Qt
      # would install neither if they were one if/else.
      - name: Install ninja, and libc++ or Qt where the matrix asks for it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then
            sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev
          fi
          if [ "${{ matrix.qt }}" = "ON" ]; then
            # The qml6-module-* packages are the QML modules the interface
            # imports at run time. On 24.04 nothing pulls them in, and an
            # application that builds and links then fails to start.
            sudo apt-get install -y --no-install-recommends \
              qt6-base-dev \
              qt6-declarative-dev \
              qml6-module-qtqml \
              qml6-module-qtqml-models \
              qml6-module-qtqml-workerscript \
              qml6-module-qtquick \
              qml6-module-qtquick-controls \
              qml6-module-qtquick-layouts \
              qml6-module-qtquick-templates \
              qml6-module-qtquick-window
          fi

      - name: Record what this job is actually building with
        run: |
          cmake --version | head -1
          ${{ matrix.cxx }} --version | head -1

      - name: Configure
        run: |
          flags=""
          if [ "${{ matrix.stdlib }}" = "libc++" ]; then flags="-stdlib=libc++"; fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_CXX_FLAGS="$flags" \
            -DCPPBP_BUILD_QT=${{ matrix.qt }} \
            -DCPPBP_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      # The Qt tests build real widgets, and the runner has no display. The
      # tests set this themselves so that running one by hand behaves the same
      # way; it is here as well because a test added later might not.
      #
      # --no-tests=error, here and in the two jobs below. Without it a run that
      # found nothing to run is a pass: ctest says "No tests were found!!!" and
      # exits 0, so a build whose tests have all disappeared is exactly as green
      # as one whose tests all passed. The test presets have chosen the other
      # answer since they were written, with noTestsAction; these lines do not
      # go through a preset, so they say it themselves.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error

  pinned:
    name: pinned toolchain (with SBOM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the pinned image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: cpp-boilerplate-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, test, and write an SBOM
        run: |
          docker run --rm -v "$PWD":/src:ro cpp-boilerplate-toolchain:ci bash -euxo pipefail -c '
            cmake --version | head -1
            cmake -S /src -B /tmp/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCPPBP_WARNINGS_AS_ERRORS=ON \
              -DMYLIB_GENERATE_SBOM=ON
            cmake --build /tmp/build
            ctest --test-dir /tmp/build --output-on-failure --no-tests=error
            cmake --install /tmp/build --prefix /tmp/prefix
            test -s /tmp/prefix/lib/sbom/mylib/mylib.spdx.json
          '

  # Everything above builds the library static, which is what BUILD_SHARED_LIBS
  # defaults to. Nothing built it shared, and shared is the configuration the
  # library template is written for: the export header, the hidden visibility
  # and the SOVERSION are all inert in a static build, so the code that
  # implements them was never once executed by a check.
  #
  # What that was worth was measured by deleting MYLIB_EXPORT from one
  # declaration in include/mylib/text.hpp. The static build passed every test.
  # The shared build failed to link, with "undefined reference to
  # mylib::text::squeeze" - from the program that consumes the installed
  # package, which is the one place a hidden symbol can show up. Forgetting the
  # macro on a new public function is the ordinary mistake in a library written
  # this way, and it was invisible to the entire repository.
  shared-library:
    name: the library, built shared
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Record what this job is actually building with
        run: |
          cmake --version | head -1
          g++ --version | head -1

      # Qt stays off, as it is by default. It installs no library, and the
      # question here is about the template that does.
      - name: Configure, build and test with BUILD_SHARED_LIBS=ON
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DCPPBP_WARNINGS_AS_ERRORS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

      # docs/versioning.md says the installed library is lib<name>.so.<MAJOR>,
      # so that something linked against one major version cannot silently load
      # another. That is a property of the file, not of the build log, and it is
      # read back here rather than assumed: without a SONAME the loader falls
      # back to the file name it was given and the promise is not kept.
      - name: Check the installed library carries a versioned SONAME
        run: |
          prefix="$RUNNER_TEMP/prefix"
          cmake --install build --prefix "$prefix"

          # Matching nothing is a failure, not a pass, for the reason the lint
          # steps say it: a shared build that installed no shared library has
          # checked nothing, and looks like one that checked everything.
          mapfile -t libraries < <(find "$prefix" -name '*.so.*' -type f | sort)
          if [ ${#libraries[@]} -eq 0 ]; then
            echo "::error::BUILD_SHARED_LIBS=ON installed no shared library"
            exit 1
          fi

          for library in "${libraries[@]}"; do
            soname=$(readelf -d "$library" | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p')
            name=${library#"$prefix"/}
            echo "$name -> ${soname:-no SONAME}"
            if [[ ! $soname =~ \.so\.[0-9]+$ ]]; then
              echo "::error::$name has no versioned SONAME (${soname:-none})"
              exit 1
            fi
          done

  # The shared pinned image has no Qt in it, deliberately: it is shared with
  # three templates that have no window, and a 250MB layer none of them use is a
  # cost they would pay on every build. So the qt template is built in the image
  # it ships instead, and gets the two things the others get from the shared one
  # - a fixed environment, and clang-tidy.
  qt-pinned:
    name: qt, in the image it ships
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image the qt template ships
        uses: docker/build-push-action@v7
        with:
          context: templates/qt/.devcontainer
          load: true
          tags: qt-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The whole repository is mounted rather than templates/qt alone, because
      # templates/qt/cmake/modules is a symlink to the shared modules and would
      # point outside a narrower mount.
      - name: Build, test, install and analyse
        run: |
          docker run --rm -v "$PWD":/src:ro -e QT_QPA_PLATFORM=offscreen qt-toolchain:ci \
            bash -euxo pipefail -c '
            cmake -S /src/templates/qt -B /tmp/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCPPBP_WARNINGS_AS_ERRORS=ON
            cmake --build /tmp/build
            ctest --test-dir /tmp/build --output-on-failure --no-tests=error
            cmake --install /tmp/build --prefix /tmp/prefix
            test -f /tmp/prefix/share/applications/myapp.desktop
            cmake -S /src/templates/qt -B /tmp/tidy -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCPPBP_ENABLE_CLANG_TIDY=ON
            cmake --build /tmp/tidy
          '

  static-analysis:
    name: clang-tidy and clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the pinned image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: cpp-boilerplate-toolchain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # clang-tidy runs in the compile step, so a violation fails the build.
      # Clang, not GCC: clang-tidy reads this build's flags, and GCC's own
      # warning names would fail every file as unknown warning options.
      # Fetched dependencies are not analysed - the module attaches clang-tidy
      # per target - so the tests are built and checked here like everything
      # else.
      # An exclusion in .clang-tidy with no reason written down is how a lint
      # configuration becomes untouchable. This makes that a build failure.
      - name: Check that every disabled check is explained
        run: ./scripts/check-tidy-rationale.sh

      # A template that needs a system library ships its own image, which means
      # a second copy of the pinned toolchain. This is what keeps the copy one.
      - name: Check that every image pins the same toolchain
        run: ./scripts/check-toolchain-pins.sh

      - name: Run clang-tidy as part of the build
        run: |
          docker run --rm -v "$PWD":/src:ro cpp-boilerplate-toolchain:ci bash -euxo pipefail -c '
            cmake -S /src -B /tmp/tidy -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCPPBP_ENABLE_CLANG_TIDY=ON
            cmake --build /tmp/tidy
          '

      # Which files each of these three runs on comes from
      # scripts/lint-paths.sh, which .githooks/pre-commit asks the same question
      # of. One list, so the hook cannot check an extension this job does not -
      # which it did, over .h and .cc, and a file could pass a commit that no
      # job would ever have disagreed with.
      #
      # The list is worked out here rather than inside the container: it is read
      # from the git index, and git inside a container refuses a bind mount it
      # does not own as an unsafe repository.
      #
      # Matching nothing is a failure, not a pass. A check that silently has no
      # work is indistinguishable from one that found none.
      - name: Check formatting
        run: |
          mapfile -t files < <(./scripts/lint-paths.sh clang-format)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no files matched"; exit 1; }
          echo "clang-format: ${#files[@]} file(s)"
          docker run --rm -v "$PWD":/src:ro cpp-boilerplate-toolchain:ci \
            bash -euo pipefail -c 'cd /src && exec clang-format --dry-run --Werror "$@"' -- "${files[@]}"

      # No `command -v` here. The hook skips a checker it cannot find, because a
      # hook that blocks a commit over a missing tool is a hook people delete;
      # a job that skips one is a job that reports nothing and looks the same as
      # one that passed. Both are in the pinned image, and if they stop being
      # there this has to fail.
      - name: Check the shell scripts
        run: |
          mapfile -t files < <(./scripts/lint-paths.sh shellcheck)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no files matched"; exit 1; }
          echo "shellcheck: ${#files[@]} file(s)"
          docker run --rm -v "$PWD":/src:ro cpp-boilerplate-toolchain:ci \
            bash -euo pipefail -c 'cd /src && exec shellcheck "$@"' -- "${files[@]}"

      # actionlint reads .github/actionlint.yml from the working directory, so
      # this has to run with the repository as its cwd rather than by path.
      - name: Check the workflows
        run: |
          mapfile -t files < <(./scripts/lint-paths.sh actionlint)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no files matched"; exit 1; }
          echo "actionlint: ${#files[@]} file(s)"
          docker run --rm -v "$PWD":/src:ro cpp-boilerplate-toolchain:ci \
            bash -euo pipefail -c 'cd /src && exec actionlint "$@"' -- "${files[@]}"

      # hadolint reads .hadolint.yaml the same way, so it runs with the
      # repository as its cwd too. One check is switched off in that file; the
      # reason is in docs/toolchain.md and nowhere else.
      - name: Check the Dockerfiles
        run: |
          mapfile -t files < <(./scripts/lint-paths.sh hadolint)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no files matched"; exit 1; }
          echo "hadolint: ${#files[@]} file(s)"
          docker run --rm -v "$PWD":/src:ro cpp-boilerplate-toolchain:ci \
            bash -euo pipefail -c 'cd /src && exec hadolint "$@"' -- "${files[@]}"
