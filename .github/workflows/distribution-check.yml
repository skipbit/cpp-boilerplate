# Guards the one claim this repository's own CI cannot see: that what people are
# given is what is here.
#
# Red means the published templates are behind, and stays red for exactly as
# long as users are looking at the older thing. Do not narrow the comparison to
# keep it green.
#
# Not in ci/: a published template has no business reporting on this
# repository's publishing.
name: distribution check

on:
  push:
    branches: [main]
  # A published repository can also drift without anything happening here.
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Naming the shell gets `bash -eo pipefail` rather than the default `bash -e`,
# so a command that fails on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  published:
    name: every template matches what is published
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Templates are read from the directory and the tree comes from
      # publish-template.sh: a second copy of either would let this job pass by
      # agreeing with itself.
      - name: Compare each template with the repository it is published to
        run: |
          set -euo pipefail

          behind=""
          {
            echo "| template | published as | state |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for dir in templates/*/; do
            name=$(basename "$dir")
            repo="${{ github.repository }}-$name"
            assembled="$RUNNER_TEMP/assembled-$name"
            published="$RUNNER_TEMP/published-$name"

            echo "::group::$name"
            ./scripts/publish-template.sh "$name" --assemble-to "$assembled"

            if ! git clone -q --depth 1 "https://github.com/${repo}.git" "$published"; then
              echo "::error::${name} has never been published: ${repo} does not exist. Run scripts/publish-template.sh ${name} --push"
              behind="$behind $name"
              printf '| %s | %s | never published |\n' "$name" "$repo" >> "$GITHUB_STEP_SUMMARY"
              echo "::endgroup::"
              continue
            fi

            # Put the assembly where the published tree was and ask git, which
            # is the question the publish itself asks - so the executable bit
            # and .gitignore are handled the same way here as there.
            find "$published" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -a "$assembled/." "$published/"

            drift=$(git -C "$published" status --porcelain)
            if [ -n "$drift" ]; then
              echo "$drift"
              echo "::error::${name} is behind: ${repo} does not match this commit. Run scripts/publish-template.sh ${name} --push"
              behind="$behind $name"
              printf '| %s | %s | behind by %s file(s) |\n' "$name" "$repo" "$(printf '%s\n' "$drift" | wc -l)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "${name}: ${repo} matches this commit"
              printf '| %s | %s | up to date |\n' "$name" "$repo" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done

          if [ -n "$behind" ]; then
            echo "Behind:${behind}"
            {
              echo
              echo "Anything outside templates/ is shared, so one change to it leaves every"
              echo "published template behind at once. Merging is not publishing; run this on"
              echo "main:"
              echo
              # One command: a line per template invites publishing them one at
              # a time, which leaves the set half old between runs.
              if [ "$(echo "$behind" | wc -w)" -gt 1 ]; then
                echo "    ./scripts/publish-template.sh --all --push"
              else
                echo "    ./scripts/publish-template.sh${behind} --push"
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
