# Dependabot covers what it knows how to read: workflow actions and the base
# image of a Dockerfile. It does not read CMake's FetchContent tags or the
# pinned apt versions inside a RUN layer, which is why
# .github/workflows/dependency-freshness.yml exists alongside it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: build
